services:
  payment-db:
    image: postgres:16-alpine
    container_name: payment-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carwash_payments
    ports:
      - "5436:5432"
    volumes:
      - payment_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carwash_payments"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    build: .
    container_name: payment-api
    ports:
      - "3003:3003"
    environment:
      DB_HOST: payment-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: carwash_payments
      # Este compose aislado no incluye Kafka: los pagos se registran, pero PaymentRegistered no se publica
      # (queda un aviso en el log). Para los eventos usar el docker-compose.yml de la raíz.
      KAFKA_BROKERS: host.docker.internal:9092
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en payment/.env (el mismo de identity)}
      JWT_ISSUER: ${JWT_ISSUER:-carwash-identity}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-carwash-platform}
    depends_on:
      payment-db:
        condition: service_healthy

volumes:
  payment_pgdata: