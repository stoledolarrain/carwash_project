# Lee un archivo .env de la carpeta desde donde se ejecuta el servicio (opcional: si no existe, se ignora).
# Así payment se configura igual que los demás microservicios. Las variables de entorno del sistema
# (por ejemplo las de docker-compose.yml) tienen prioridad sobre este archivo.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:3003}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carwash_payments}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Apache Kafka: Payment publica el evento PaymentRegistered en el topic payment.payment.registered.
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.producer.client-id=${KAFKA_CLIENT_ID:payment-service}
spring.kafka.producer.acks=all
# Si Kafka no responde, no bloquear la petición de registro de pago más de unos segundos.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
kafka.send-timeout-ms=5000

# JWT de Identity Service: deben ser los mismos valores de identity/.env y api-gateway/.env.
# JWT_SECRET no tiene valor por defecto: sin él el servicio no arranca.
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:carwash-identity}
jwt.audience=${JWT_AUDIENCE:carwash-platform}