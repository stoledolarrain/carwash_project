server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aplicación de una sola página: cualquier ruta del navegador devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre pueden guardarse en caché por mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
