server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: resolver el Gateway al momento de cada petición permite que nginx
    # arranque aunque el Gateway todavía no esté listo.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:8080;

    # El frontend llama a /api/... en su mismo origen y nginx lo reenvía al API Gateway (sin CORS).
    location /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        client_max_body_size 1m;
    }

    # Aplicación de una sola página: cualquier ruta del navegador devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre pueden guardarse en caché por mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
